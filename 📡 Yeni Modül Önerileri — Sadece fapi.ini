⚠️ Rate Limit / Mimari Genel Uyarı
Binance Futures REST API ağırlık-bazlı (weight-based) rate limit kullanıyor (dakikada ~2400 ağırlık). Önerilerin bir kısmı (premiumIndex parametresiz, ticker/24hr parametresiz) tek çağrıda tüm piyasayı getirdiği için çok verimli; ama globalLongShortAccountRatio gibi sembol-bazlı zorunlu endpoint'ler için tüm 300+ sembole tek tek istek atmak hem gereksiz hem rate-limit riskli.

Öneri: Modül #1 ve benzerleri için screener.py'nin zaten ürettiği shortlist mekanizmasını (muhtemelen 20-40 sembol) reuse edin — "piyasa geneli" yerine "izlenen evren geneli" olarak çerçeveleyin, bu hem gerçekçi hem performanslı olur. Bu aynı zamanda önceki raporda belirtilen "merkezi veri kaynağı, tekrar çekme yok" prensibiyle tam uyumlu.

İsterseniz bir sonraki adımda bunlardan birini (örneğin #2 market_wide_funding_pulse.py veya #6 exchange_risk_watch.py — ikisi de düşük efor/yüksek değer) somut kod iskeleti + config.py parametreleri + telegram mesaj şablonu olarak detaylandırabilirim.