📡 Yeni Modül Önerileri — Sadece fapi.binance.com (Binance Futures REST API) Kaynaklı
Kapsamı netleştiriyorum: Aşağıdaki hepsi Binance USDT-M Futures REST API'nin (https://fapi.binance.com) halihazırda sunduğu, dış servise (CoinGecko, Glassnode vb.) ihtiyaç duymayan endpoint'ler. Mevcut exchange.py'nin zaten bu domain'le konuştuğunu biliyoruz — bu yüzden her modül için hangi fonksiyonun exchange.py'ye merkezi olarak eklenmesi gerektiğini de belirtiyorum (DRY ihlalini tekrarlamamak için).

⚠️ Not: WebSocket stream'leri (!forceOrder@arr, !markPrice@arr gibi) teknik olarak fstream.binance.com altında, fapi.binance.com değil. Siz sadece REST'e (fapi.binance.com) odaklandığınız için bunları REST polling alternatifleriyle sundum, ama sonda kısa bir not olarak WS seçeneğini de belirttim (isterseniz dahil edin, istemezseniz tamamen REST ile de yapılabilir).

1) market_sentiment_radar.py — Piyasa Pozisyonlanma Radarı
Amaç: Tekil coin bazlı whale/OI analizinin piyasa-geneli (veya izleme listesi bazlı) versiyonu — "kalabalık" ile "büyük oyuncular" arasındaki ayrışmayı yakalamak.

Endpoint	Veri	Parametre Kısıtı
GET /futures/data/globalLongShortAccountRatio	Tüm hesapların long/short oranı	symbol zorunlu, bulk yok → sembol başına çağrı
GET /futures/data/topLongShortAccountRatio	Top trader hesap bazlı oran	aynı
GET /futures/data/topLongShortPositionRatio	Top trader pozisyon büyüklüğü bazlı oran	aynı
GET /futures/data/takerlongshortRatio	Taker alım/satım hacim oranı	aynı
Sinyal mantığı: topLongShortPositionRatio ile globalLongShortAccountRatio arasındaki ayrışma en değerli kısım — "genel kitle %70 long, top trader'lar %55 short" gibi bir ayrışma genelde fiyatın top trader yönüne gittiği bir kontrarian sinyaldir. Bu, whale_alert.py'nin tekil-coin taker analizi felsefesine çok yakın, piyasa-geneli uzantısı olur.

Örnek mesaj taslağı:

text

📊 PİYASA POZİSYONLANMA RADARI — BTC
Genel Kitle (Hesap Bazlı): %71 LONG / %29 SHORT
Top Trader (Pozisyon Bazlı): %54 SHORT / %46 LONG
⚠️ Ayrışma Tespit Edildi: Kalabalık long'da, büyük oyuncular short ağırlıklı
Taker Akışı (son 1s): %58 Sat / %42 Al
Mimari not: exchange.py'ye get_position_ratios(symbol, period) gibi tek bir merkezi fonksiyon eklenmeli — izleme listesi screener.py'nin zaten ürettiği shortlist'ten beslenmeli (BTC, ETH + taranan coinler), tüm sembollere tek tek istek atıp rate-limit yakmaktan kaçının.

2) market_wide_funding_pulse.py — Piyasa-Geneli Funding Nabzı
Amaç: funding_radar.py'nin tekil-coin odaklı analizini piyasa-geneline taşımak — "piyasa genelinde long'lar ne kadar ısınmış" sorusuna cevap.

Endpoint	Veri
GET /fapi/v1/premiumIndex (symbol parametresiz)	Tek çağrıda tüm USDT-M çiftlerin mark price, index price, funding rate, next funding time bilgisi
Bu, weight açısından çok verimli — tek bir istekle 300+ sembolün funding'i geliyor, loop gerekmiyor.

Hesaplanabilecek metrikler:

Medyan/ortalama funding rate (piyasa ısınma göstergesi)
|funding| > X olan sembol sayısı/oranı (aşırı pozisyonlanma yaygınlığı)
En yüksek pozitif/negatif funding'e sahip top 5 (zaten funding_radar.py'nin tetiklediği coinlerle çapraz kontrol edilebilir — "bu coin tekil olarak mı sıra dışı, yoksa piyasa geneli mi öyle" ayrımı)
Mark-Index spread'in piyasa genelinde ortalaması (manipülasyon/anormal fiyatlama taraması)
Örnek mesaj:

text

🌐 PİYASA FUNDING NABZI
Medyan Funding: +0.0089% | Ortalama: +0.0112%
Aşırı Pozitif Funding (>0.05%): 23 sembol (toplam 312'nin %7.4'ü)
Aşırı Negatif Funding (<-0.05%): 4 sembol
🔥 En Isınmış: XUSDT (+0.187%), YUSDT (+0.156%)
Yorum: Piyasa genelinde long tarafı belirgin şekilde daha fazla risk primi ödüyor
Mimari not: funding_radar.py ile aynı veriyi (premiumIndex) kullanacağı için, tek coin çekimi ile piyasa-geneli çekimi aynı merkezi fonksiyondan (exchange.get_all_premium_index()) türetilmeli — iki modülün ayrı ayrı premiumIndex çağırması gereksiz.

3) oi_market_breadth.py — Açık Pozisyon Genişliği (Breadth)
Amaç: Tekil coin OI analizinin (volume_spike.py, whale_alert.py) piyasa-geneli "kaç coin'de OI artıyor" sorusuna dönüşmesi — klasik "market breadth" kavramının OI versiyonu.

Endpoint	Veri	Not
GET /fapi/v1/openInterest	Anlık OI (sembol başına)	Zaten screener.py'de kullanılıyor
GET /futures/data/openInterestHist	Zaman serisi OI	Zaten screener.py'de kullanılıyor
Yeni olan kısım: Bu veriyi tek coin için değil, izlenen tüm coinler için toplu çekip "kaçının OI'si son 1 saatte arttı / kaçının azaldı" oranını hesaplamak.

Sinyal mantığı:

OI breadth yükseliyor + fiyat breadth (yükselen coin sayısı) düşüyor → "sessiz pozisyon birikimi", patlama öncesi tipik desen
OI breadth çöküyor + fiyat yatay → ilgi kaybı, likidite çekilmesi
Örnek mesaj:

text

📈 AÇIK POZİSYON GENİŞLİĞİ (Son 1 Saat)
OI Artan: 187/312 sembol (%60)
OI Azalan: 98/312 sembol (%31)
⚠️ Dikkat: OI breadth yükseliyor ama fiyat breadth düşüyor (132 kırmızı / 180 yeşil)
Yorum: Piyasada sessiz pozisyon birikimi olabilir
Mimari not: screener.py'nin zaten kurduğu OI-history mekanizmasının (new_oi_history dict'i) tekrar kullanılması gerekir — ayrı bir OI çekme döngüsü kurmak, bu rapordaki "3 bağımsız OI-çekme yolu" sorununa 4.'sünü ekler. Bunun yerine screener.py'nin tur sonunda zaten elinde olan veriden bu breadth metriği türetilmeli, yeniden çekilmemeli.

4) futures_volume_dominance.py — Perpetual Hacim Dominansı (BTC Dominance Proxy'si)
Amaç: Dış servise (CoinGecko BTC.D) ihtiyaç duymadan, sadece Binance futures hacim verisiyle benzer bir "alt season / BTC'ye kaçış" göstergesi üretmek.

Endpoint	Veri
GET /fapi/v1/ticker/24hr (symbol parametresiz)	Tüm sembollerin 24s hacim, quoteVolume, fiyat değişimi — tek çağrıda
Hesaplanabilecek metrik:

text

BTC+ETH quoteVolume toplamı / Tüm USDT-M çiftlerin quoteVolume toplamı
Bu oran düşüyorsa hacim altcoinlere kayıyor demektir (alt season proxy'si); yükseliyorsa sermaye BTC/ETH'ye sıkışıyor (risk-off).

Ayrıca aynı endpoint'ten piyasa-geneli yükselen/düşen sembol sayısı (breadth) da ücretsiz çıkar — "312 coin'den 210'u son 24 saatte yeşil" gibi basit ama etkili bir market-mood göstergesi.

Örnek mesaj:

text

🪙 FUTURES HACİM DOMİNANSI
BTC+ETH Hacim Payı: %34.2 (dün: %38.7, ↓4.5pp)
Piyasa Nefesi: 218/312 sembol yeşil (%70)
Yorum: Hacim payı düşüyor + geniş katılım yüksek → Alt-season eğilimi güçleniyor
Mimari not: Tek bir weight-verimli çağrı; screener.py'nin coin seçim aşamasında zaten çektiği 24hr ticker verisiyle aynı kaynak — mükerrer çağrı yerine screener'ın tur başı verisi paylaşılmalı.

5) liquidation_market_monitor.py — Piyasa-Geneli Likidasyon İzleyici (REST Polling)
Amaç: whale_alert.py'nin tekil coin forceOrders okumasını (ve exchange.py'deki sessizce yutulan hatasını) piyasa-geneli bir modüle dönüştürmek.

Endpoint	Veri	Kısıt
GET /fapi/v1/allForceOrders veya GET /fapi/v1/forceOrders	Likidasyon emirleri	Not: Bu endpoint'ler genelde kendi hesabınızın likidasyonlarını döner; piyasa-geneli halka açık likidasyon verisi normalde WS stream'den (!forceOrder@arr) gelir. Saf REST'te piyasa-geneli gerçek zamanlı likidasyon verisi sınırlıdır.
Gerçekçi REST alternatifi: Doğrudan piyasa-geneli likidasyon akışı REST'te yok; bunun yerine OI'deki ani düşüşleri (açık pozisyonun aniden kapanması = dolaylı likidasyon göstergesi) openInterestHist + fiyat hareketi kombinasyonuyla proxy olarak kullanmak gerekir: "OI %X düştü + fiyat %Y hareket etti = olası likidasyon dalgası".

Dürüst not: Bu modül için gerçek değeri yakalamak isterseniz fstream.binance.com'daki !forceOrder@arr WS stream'i şart — REST ile sadece gecikmeli/dolaylı proxy mümkün. Bunu şeffaf şekilde kullanıcıya "OI düşüşünden türetilmiş tahmini likidasyon baskısı" olarak sunmalısınız (whale_alert.py'nin dürüst disclaimer kültürüne uygun).

6) exchange_risk_watch.py — Borsa Risk Parametresi Değişiklik İzleyici
Amaç: Binance'in kendi risk duruşundaki değişiklikleri (genelde volatilite öncesi/sonrası yapılır) erken yakalamak — şu ana kadar hiçbir modülde yok, özgün bir fikir.

Endpoint	Veri
GET /fapi/v1/leverageBracket	Sembol bazlı maksimum kaldıraç / bakım marjı kademeleri
GET /fapi/v1/exchangeInfo	Sembol durumu (TRADING/BREAK/SETTLING), fiyat/miktar hassasiyet filtreleri
Sinyal mantığı:

Bir coin'in maksimum izin verilen kaldıracı düşürülürse (örn. 50x→20x) → Binance'in o coin için risk algısı artmış demektir, genelde ciddi volatilite öncesi veya sonrası yapılır.
Sembol durumu TRADING'den BREAK'e geçerse → operasyonel kritik uyarı: o an açık pozisyonunuz varsa anında bilgilendirilmeniz gerekir (bu, botun kendi pozisyon güvenliği için doğrudan değerli).
Yeni sembol listelenmesi (exchangeInfo'da önceden olmayan bir sembolün belirmesi) → screener.py'nin tarama evrenine otomatik dahil olma fırsatı bildirimi.
Örnek mesaj:

text

⚠️ BORSA RİSK PARAMETRESİ DEĞİŞİKLİĞİ — XUSDT
Maksimum Kaldıraç: 50x → 20x (düşürüldü)
Olası Neden: Artan volatilite / açık pozisyon yoğunlaşması
Not: Bu coin'de açık pozisyonunuz varsa marjin gereksinimi değişmiş olabilir
Mimari not: Bu tamamen yeni bir veri ailesi — mevcut hiçbir modülle çakışmıyor, DRY riski yok. Periyodik (örn. 15 dk) exchangeInfo/leverageBracket snapshot'ı alıp bir önceki snapshot'la diff'lemek yeterli; state_manager.py tarzı atomic-write ile son snapshot saklanmalı.

7) basis_premium_monitor.py — Vadeli Prim/İskonto İzleyici (Sınırlı Kapsam)
Endpoint	Veri	Kısıt
GET /futures/data/basis	Vadeli sözleşme ile index fiyatı arasındaki baz (basis), yıllıklandırılmış oran	Bu endpoint esas olarak çeyreklik (delivery) kontratlar için anlamlı; perpetual'larda zaten premiumIndex'teki mark-index farkı aynı işi görüyor
Gerçekçi değerlendirme: Perpetual-ağırlıklı bir bot için bu modülün değeri sınırlı — zaten premiumIndex'ten (modül #2) mark-index spread'i çıkarılabiliyor. Düşük öncelik, sadece BTC/ETH çeyreklik kontratlarla ilgileniyorsanız anlamlı.

